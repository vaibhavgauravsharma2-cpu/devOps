global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mern-ecommerce-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mern-server'
    static_configs:
      - targets: ['server:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
