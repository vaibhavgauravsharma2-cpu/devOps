# ============================================================
# Nginx Ingress (requires nginx ingress controller)
# For minikube: minikube addons enable ingress
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mern-ingress
  namespace: mern-ecommerce
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: mern-ecommerce.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mern-server-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mern-client-service
                port:
                  number: 8080
    - host: grafana.mern.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mern-grafana-service
                port:
                  number: 3000
    - host: prometheus.mern.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mern-prometheus-service
                port:
                  number: 9090
