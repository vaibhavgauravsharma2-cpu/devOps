# ============================================================
# Express API ConfigMap + Secret + Deployment + Service
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mern-server-config
  namespace: mern-ecommerce
data:
  PORT: "3000"
  BASE_API_URL: "api"
  CLIENT_URL: "http://localhost:30080"
  MONGO_URI: "mongodb://mern-mongodb-service:27017/mern_ecommerce"
  NODE_ENV: "production"

---
apiVersion: v1
kind: Secret
metadata:
  name: mern-server-secrets
  namespace: mern-ecommerce
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production-use-a-strong-random-secret"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-server
  namespace: mern-ecommerce
  labels:
    app: mern-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mern-server
  template:
    metadata:
      labels:
        app: mern-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: mern-server
          image: DOCKERHUB_USERNAME/mern-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: mern-server-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mern-server-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: mern-server-service
  namespace: mern-ecommerce
  labels:
    app: mern-server
spec:
  selector:
    app: mern-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
